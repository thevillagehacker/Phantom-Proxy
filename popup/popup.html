<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <link rel="stylesheet" href="../panel/theme.css" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Rajdhani:wght@500;600;700&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 280px;
      background: var(--bg-void);
      color: var(--text-primary);
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
    }

    /* ── Header ── */
    .header {
      padding: 14px 14px 12px;
      border-bottom: 1px solid color-mix(in srgb, var(--accent) 12%, transparent);
      position: relative;
    }

    .header::after {
      content: '';
      position: absolute;
      bottom: -1px; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, var(--accent), transparent);
      opacity: 0.4;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 10px;
    }

    .brand-hex {
      font-size: 22px;
      color: var(--accent);
      filter: drop-shadow(0 0 8px var(--accent));
      animation: hex-pulse 3s ease-in-out infinite;
    }

    @keyframes hex-pulse {
      0%,100% { filter: drop-shadow(0 0 4px var(--accent)); }
      50%      { filter: drop-shadow(0 0 14px var(--accent)); }
    }

    .brand-name {
      font-family: 'Rajdhani', sans-serif;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 2.5px;
    }

    .brand-name span { color: var(--accent); }

    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .status-dot {
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: 'Rajdhani', sans-serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 1px;
      color: var(--green);
    }

    .pulse {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 6px var(--green);
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%,100% { opacity: 1; transform: scale(1); }
      50%      { opacity: 0.4; transform: scale(0.7); }
    }

    .version {
      font-size: 10px;
      color: var(--text-dim);
      letter-spacing: 0.5px;
    }

    /* ── Body ── */
    .body { padding: 14px; }

    /* ── Execute Button ── */
    .execute-btn {
      width: 100%;
      padding: 11px;
      background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 12%, transparent), color-mix(in srgb, var(--accent) 4%, transparent));
      border: 1px solid var(--accent);
      border-radius: 3px;
      color: var(--accent);
      font-family: 'Rajdhani', sans-serif;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 2px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.15s ease;
      margin-bottom: 10px;
      position: relative;
      overflow: hidden;
    }

    .execute-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, color-mix(in srgb, var(--accent) 15%, transparent), transparent);
      opacity: 0;
      transition: opacity 0.15s ease;
    }

    .execute-btn:hover {
      box-shadow: 0 0 20px color-mix(in srgb, var(--accent) 25%, transparent), inset 0 0 20px color-mix(in srgb, var(--accent) 5%, transparent);
      transform: translateY(-1px);
    }

    .execute-btn:hover::before { opacity: 1; }
    .execute-btn:active { transform: translateY(0); }

    .execute-icon {
      font-size: 18px;
      filter: drop-shadow(0 0 4px var(--accent));
    }

    .execute-sub {
      font-size: 10px;
      color: var(--text-dim);
      text-align: center;
      margin-bottom: 14px;
      font-family: 'Rajdhani', sans-serif;
      letter-spacing: 0.5px;
      line-height: 1.5;
    }

    /* ── Divider ── */
    .divider {
      height: 1px;
      background: color-mix(in srgb, var(--accent) 8%, transparent);
      margin: 12px 0;
    }

    /* ── DevTools hint ── */
    .devtools-hint {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      padding: 10px;
      background: color-mix(in srgb, var(--accent) 3%, transparent);
      border: 1px solid color-mix(in srgb, var(--accent) 8%, transparent);
      border-radius: 3px;
    }

    .hint-icon { font-size: 15px; color: var(--text-dim); flex-shrink: 0; margin-top: 1px; }

    .hint-text {
      font-family: 'Rajdhani', sans-serif;
      font-size: 11px;
      color: var(--text-dim);
      line-height: 1.6;
    }

    .hint-text strong { color: var(--text-secondary); }

    /* ── Info rows ── */
    .info-rows { margin-bottom: 12px; }

    .info-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 5px 0;
      border-bottom: 1px solid var(--border);
    }

    .info-row:last-child { border-bottom: none; }
    .info-key { color: var(--text-dim); font-size: 10px; font-family: 'Rajdhani', sans-serif; letter-spacing: 1px; font-weight: 600; }
    .info-val { font-size: 10px; color: var(--text-secondary); }
  </style>
</head>
<body>

  <div class="header">
    <div class="brand">
      <span class="brand-hex">⬡</span>
      <span class="brand-name">PHANTOM<span>PROXY</span></span>
    </div>
    <div class="status-row">
      <div class="status-dot">
        <div class="pulse"></div>
        ACTIVE
      </div>
      <span class="version">v2.3.0</span>
    </div>
  </div>

  <div class="body">

    <!-- Execute Button -->
    <button class="execute-btn" id="btn-execute">
      <span class="execute-icon">◈</span>
      EXECUTE
    </button>
    <p class="execute-sub">Opens PhantomProxy in a dedicated full-screen window</p>

    <div class="divider"></div>

    <!-- Info -->
    <div class="info-rows">
      <div class="info-row">
        <span class="info-key">MODE</span>
        <span class="info-val">PASSIVE CAPTURE</span>
      </div>
      <div class="info-row">
        <span class="info-key">MAX REQUESTS</span>
        <span class="info-val">500</span>
      </div>
      <div class="info-row">
        <span class="info-key">BODY CAP</span>
        <span class="info-val">64 KB</span>
      </div>
    </div>

    <div class="divider"></div>

    <!-- DevTools hint -->
    <div class="devtools-hint">
      <span class="hint-icon">ℹ</span>
      <span class="hint-text">
        Also available inside <strong>DevTools (F12)</strong> under the PhantomProxy panel tab.
      </span>
    </div>

  </div>

  <script src="popup.js"></script>
</body>
</html>
